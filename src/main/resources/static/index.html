<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Employee Management System</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card p-4 shadow">

        <h3 class="text-center mb-4">Add Employee</h3>

        <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name">

        <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">

        <input type="text" id="department" class="form-control mb-3" placeholder="Enter Department">

        <input type="number" id="salary" class="form-control mb-3" placeholder="Enter Salary">

        <button id="saveBtn" class="btn btn-success w-100" onclick="saveEmployee()">
            Save Employee
        </button>

    </div>

</div>
<script src="js/script.js"></script>
</body>
</html>
